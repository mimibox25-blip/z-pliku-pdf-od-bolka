    <style>
        body {
            font-family: Arial, sans-serif;

            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        .question-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .answers-list {
            list-style-type: none;
            padding-left: 0;
        }
        .answers-list li {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }
        .answers-list label {
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }

        /* Stylizacja podświetleń po sprawdzeniu */
        .answers-list li.option-correct-target {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .answers-list li.option-wrong-selected {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .status-tag {
            font-weight: bold;
            margin-left: auto;
            padding-left: 10px;
        }

        button.btn-check {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95em;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.btn-check:hover {
            background-color: #2980b9;
        }
        .feedback {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .feedback.incorrect {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #eef7fc;
            border-left: 4px solid #3498db;
            border-radius: 0 4px 4px 0;
        }
        .explanation-box .orig-text {
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        .explanation-box .noob-expl {
            font-size: 0.88em;
            font-style: italic;
            color: #4a5568;
            margin-top: 8px;
            border-top: 1px dashed #cbd5e0;
            padding-top: 8px;
        }
        .noob-expl strong {
            font-style: normal;
        }

</head>

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let newArr = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
            }
            return newArr;
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const shuffledOptions = shuffle(q.options);
                
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${q.id}`;

                let html = `<div class="question-title">${index + 1}. ${q.title}</div>`;
                html += `<ul class="answers-list" id="list-${q.id}">`;

                shuffledOptions.forEach((opt, optIndex) => {
                    const inputId = `q${q.id}_opt${optIndex}`;
                    const inputType = q.type;
                    const inputName = `question_${q.id}`;
                    
                    html += `
                        <li id="li_${inputId}">
                            <label for="${inputId}">
                                <input type="${inputType}" id="${inputId}" name="${inputName}" data-correct="${opt.correct}">
                                <span>${opt.text}</span>
                                <span class="status-tag" id="status_${inputId}"></span>
                            </label>
                        </li>
                    `;
                });

                html += `</ul>`;
                html += `<button class="btn-check" onclick="checkAnswer(${q.id})">Sprawdź</button>`;
                html += `<div class="feedback" id="feedback-${q.id}"></div>`;

                if (q.explanation) {
                    html += `
                        <div class="explanation-box">
                            <div class="orig-text">${q.explanation.orig}</div>
                            <div class="noob-expl">${q.explanation.noob}</div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function checkAnswer(questionId) {
            const card = document.getElementById(`question-${questionId}`);
            const inputs = card.querySelectorAll('input');
            const feedback = document.getElementById(`feedback-${questionId}`);
            
            let isAllCorrect = true;

            inputs.forEach(input => {
                const li = document.getElementById(`li_${input.id}`);
                const statusTag = document.getElementById(`status_${input.id}`);
                const isCorrectAnswer = input.getAttribute('data-correct') === 'true';
                const isChecked = input.checked;

                // Reset klas podświetlenia
                li.className = '';
                statusTag.innerText = '';

                // Jeśli odpowiedź jest PRAWIDŁOWA (niezależnie czy zaznaczona czy nie)
                if (isCorrectAnswer) {
                    li.classList.add('option-correct-target');
                    statusTag.innerText = '✓ Prawidłowa';
                    if (!isChecked) {
                        isAllCorrect = false; // Nie zaznaczono dobrej odpowiedzi
                    }
                } else {
                    // Jeśli odpowiedź jest BŁĘDNA, a użytkownik ją ZAZNACZYŁ
                    if (isChecked) {
                        li.classList.add('option-wrong-selected');
                        statusTag.innerText = '✗ Błędna';
                        isAllCorrect = false;
                    }
                }
            });

            feedback.style.display = 'block';
            if (isAllCorrect) {
                feedback.className = 'feedback correct';
                feedback.innerText = 'Świetnie! Zaznaczono dokładnie wszystkie prawidłowe odpowiedzi.';
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerText = 'Wskazano niepełne lub niepoprawne opcje. Prawidłowe opcje zostały podświetlone na zielono, a Twoje błędne zaznaczenia na czerwono.';
            }
        }

        window.onload = renderQuiz;
    </script>
